name: Weekly newsletter

on:
  schedule:
    - cron: "0 4 * * 5"       # every Friday at 04:00 UTC = 08:00 UAE
  workflow_dispatch:          # manual "Run workflow" button
    inputs:
      week_ending:
        description: "Friday ending the week (YYYY-MM-DD). Leave blank for today if Friday, else the most recent Friday."
        required: false
        default: ""
      send:
        description: "Email the newsletter (untick to only save it in newsletters/)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: data-updates         # same group as the daily job, so they never clash
  cancel-in-progress: false

jobs:
  newsletter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collect latest feeds
        run: python scripts/collect.py

      - name: Find releases
        run: python scripts/analyse.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Rank releases
        run: python scripts/rank.py ${WEEK_ENDING:+--week-ending "$WEEK_ENDING"}
        env:
          WEEK_ENDING: ${{ inputs.week_ending }}

      - name: Write and send newsletter
        run: python scripts/newsletter.py ${{ (github.event_name == 'workflow_dispatch' && !inputs.send) && '--no-send' || '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NEWSLETTER_TO: ${{ secrets.NEWSLETTER_TO }}

      - name: Save results
        if: always()          # keep the collected data even if a later step failed
        run: |
          git config user.name "newsletter-bot"
          git config user.email "newsletter-bot@users.noreply.github.com"
          git add data/ newsletters/ 2>/dev/null || git add data/
          git diff --cached --quiet || git commit -m "Newsletter $(date -u +%Y-%m-%d)"
          git push
