   name: Weekly newsletter

   on:
     workflow_dispatch:

   permissions:
     contents: write

   concurrency:
     group: data-updates
     cancel-in-progress: false

   jobs:
     newsletter:
       runs-on: ubuntu-latest
       steps:
         - uses: actions/checkout@v4
         - uses: actions/setup-python@v5
           with:
             python-version: "3.12"
             cache: pip
         - run: pip install -r requirements.txt
         - name: Find releases
           run: python scripts/analyse.py
           env:
             ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
         - name: Save results
           run: |
             git config user.name "newsletter-bot"
             git config user.email "newsletter-bot@users.noreply.github.com"
             git add data/
             git diff --cached --quiet || git commit -m "Analyse releases $(date -u +%Y-%m-%d)"
             git push
