   name: Collect feeds (daily)

   on:
     schedule:
       - cron: "0 2 * * *"      # every day at 02:00 UTC = 06:00 UAE
     workflow_dispatch:          # adds a "Run workflow" button for manual runs

   permissions:
     contents: write

   concurrency:
     group: data-updates
     cancel-in-progress: false

   jobs:
     collect:
       runs-on: ubuntu-latest
       steps:
         - uses: actions/checkout@v7
         - uses: actions/setup-python@v7
           with:
             python-version: "3.12"
             cache: pip
         - run: pip install -r requirements.txt
         - run: python scripts/collect.py
         - name: Save collected items
           run: |
             git config user.name "newsletter-bot"
             git config user.email "newsletter-bot@users.noreply.github.com"
             git add data/items.json
             git diff --cached --quiet || git commit -m "Collect feeds $(date -u +%Y-%m-%d)"
             git push
