# How releases are ranked. Edit the numbers to change what rises to the top.
#
# Each release gets two scores from 0 to 1, combined with these weights:
#   personal:    how close the artist is to what you listen to on Last.fm.
#                Any artist you've played, even once, scores 0.5 to 1.0
#                (more plays = higher). Artists similar to ones you play
#                score up to 0.4. Needs lastfm_user below and the
#                LASTFM_API_KEY secret; without them it's left out.
#   popularity:  how widely the release was covered this week (each publication
#                counts once, weighted by sources.yaml) mixed with how big the
#                artist is (Deezer fans; 10 million or more = 1.0).
#
# Review scores are not used: most reviews come out on or after release day.
# The weights don't have to add up to 1; they're used as proportions.

lastfm_user: "zaidaftab"        # your Last.fm username

weights:
  personal: 0.8
  popularity: 0.2

# How popularity is made up (should add up to 1)
popularity_mix:
  coverage: 0.7        # number of publications covering it this week
  artist_fans: 0.3     # Deezer fan count

# Albums count more than singles. The final score is multiplied by these.
type_weight:
  album: 1.0
  mixtape: 0.9
  ep: 0.8
  single: 1.0

# How many releases appear in the newsletter
top_overall: 10
per_genre: 6


# "Discover" section: releases by artists you've never played but who are similar
# to ones you do (from Last.fm), favouring smaller artists. Not in the top 10.
discover:
  count: 6                  # how many to show
  max_artist_fans: 25000   # leave out artists with more Deezer fans than this
