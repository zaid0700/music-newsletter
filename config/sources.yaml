# Feeds the tool reads every day.
# To add or remove a source, edit this file only. No code changes needed.
#
# weight: how much coverage from this publication counts toward "popularity"
#         (1.0 = normal). Feeds from the same publication, e.g. Pitchfork's three,
#         count as one publication.
# type:   "reviews" = review feed, "news" = general news, "video" = YouTube reviews
#
# Feeds marked "check" couldn't be tested from Claude's workspace. Run the
# "Check feeds" workflow (or scripts/check_feeds.py) and delete any that FAIL.
# A broken feed never stops the newsletter; it's just skipped.

sources:
  # --- Indie / alternative / general --------------------------------------
  - name: Pitchfork (album reviews)
    url: https://pitchfork.com/feed/feed-album-reviews/rss
    type: reviews
    weight: 1.0

  - name: Pitchfork (Best New Albums)
    url: https://pitchfork.com/feed/reviews/best/albums/rss
    type: reviews
    weight: 1.0

  - name: Pitchfork (track reviews)
    url: https://pitchfork.com/feed/feed-track-reviews/rss
    type: reviews
    weight: 1.0

  - name: Pitchfork (news)                       # check
    url: https://pitchfork.com/feed/feed-news/rss
    type: news
    weight: 1.0

  - name: Stereogum
    url: https://www.stereogum.com/feed/
    type: news
    weight: 1.0

  - name: The Needle Drop (YouTube)
    url: https://www.youtube.com/feeds/videos.xml?channel_id=UCt7fwAhXDy3oNFTAzF2o8Pw
